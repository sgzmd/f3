services: 
  
  database:
    image: mariadb:latest
    ports:
      - 3366:3306
    volumes:
      - flibudata:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=toor
      - MYSQL_PASSWORD=${ENV_MARIADB_PASSWORD}
      - MYSQL_USER=${ENV_MARIADB_USER}
      - MYSQL_DATABASE=${ENV_MARIADB_DATABASE}
    # looks like mysqladmin is no longer in the image
    # healthcheck:
    #   test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${ENV_MARIADB_USER}", "-p${ENV_MARIADB_PASSWORD}"]
    #   interval: 30s
    #   timeout: 30s
    #   retries: 99999
    networks:
      - flibunetwork

  flibuserver:
    build:
      context: .
    # links:
    #   - database
    environment:
      MARIADB_HOST: ${ENV_MARIADB_HOST}
      MARIADB_USER: ${ENV_MARIADB_USER}
      MARIADB_PASSWORD: ${ENV_MARIADB_PASSWORD}
      MARIADB_DATABASE: ${ENV_MARIADB_DATABASE}
      MARIADB_PORT: 3306
      TELEGRAM_API_KEY: ${ENV_TELEGRAM_API_KEY}
      TELEGRAM_CHAT_ID: ${ENV_TELEGRAM_CHAT_ID}
      FLIBUSERVER_PORT: ${ENV_FLIBUSERVER_PORT}
      FLIBUSTA_BASE_URL: ${ENV_FLIBUSTA_BASE_URL}
    depends_on:
      - database
    volumes:
        - 'flibudata:/var/local/flibudata'
    ports:
        - 9001
    restart: unless-stopped
    healthcheck:
          test: ["CMD-SHELL", "./grpc_health_probe-linux-amd64 -addr=flibuserver:${ENV_FLIBUSERVER_PORT} || exit 1"]
          interval: 5s
          timeout: 1s
          retries: 99999
    networks:
      - flibunetwork

  web:
    build: 
      context: ../web
    environment:
      TELEGRAM_API_KEY: ${ENV_TELEGRAM_API_KEY}
      BACKEND_URL: flibuserver:9001
      WEB_PORT: 8088
      BOT_NAME: ${ENV_BOT_NAME}
      DOMAIN_NAME: ${ENV_DOMAIN_NAME}
    depends_on:
      flibuserver:
        condition: service_healthy
    ports:
      - '8088:8088'
    networks:
      - flibunetwork

volumes:
  flibudata:

networks:
  flibunetwork:
    driver: bridge  
